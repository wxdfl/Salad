name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: salad-apk
          path: app/build/outputs/apk/release/app-release.apk
